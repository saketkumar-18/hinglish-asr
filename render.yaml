services:
  - type: web
    name: hinglish-asr
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WHISPER_MODEL
        value: small
      - key: WHISPER_COMPUTE
        value: int8
    healthCheckPath: /api/health
